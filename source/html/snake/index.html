  c.globalAlpha = 1;
}

function drawBoardEdgePulse(c, now, t) {
  // subtle danger glow when the head is in the outer ring of cells
  const h = S.snake[0]; if (!h || S.phase !== 'playing') return;
  const edge = Math.min(h.x, h.y, G.cols - 1 - h.x, G.rows - 1 - h.y);
  if (edge > 1) return;
  const k = (1 - edge) * .5 + .25;
  c.save();
  c.globalAlpha = k * (.6 + .4 * Math.sin(now / 120));
  roundRect(c, G.bx + 1.5, G.by + 1.5, G.boardW - 3, G.boardH - 3, Math.max(12, G.cell * .7));
  c.strokeStyle = DIFFS[S.difficulty].wrap ? 'rgba(94,242,184,.6)' : 'rgba(255,94,168,.7)';
  c.lineWidth = 2.2; c.stroke();
  c.restore();
}

/* ─────────────── the snake itself ─────────────── */
function drawSnake(c, now, t) {
  if (!S.snake.length) return;
  const L = G;
  const cell = L.cell;
  const r = buildRoute(t);
  const P = r.pts;
  const N = r.len;
  if (N < 2) return;
  const hpx = L.bx + r.headX * cell, hpy = L.by + r.headY * cell;
  const tSec = now / 1000;
  const dying = S.phase === 'dying';
  const dk = dying ? clamp(S.dyingT / .9, 0, 1) : 0;

  // body width profile (in board px)
  const halfW = cell * .355;
  const speedBoost = S.boostTimer > 0;
  const phantom = S.phantomTimer > 0;
  const alpha = dying ? (1 - dk) : (phantom ? .62 : 1);

  c.save();
  c.globalAlpha = alpha;

  // ── 1. outer glow (wide, low alpha)
  c.globalCompositeOperation = 'lighter';
  strokePath(c, P, 0, N - 1, halfW * 2 + cell * .72, 'rgba(94,242,184,.028)');
  strokePath(c, P, 0, N - 1, halfW * 2 + cell * .30, 'rgba(49,215,234,.022)');
  c.globalCompositeOperation = 'source-over';

  // ── 2. dark base (defines body silhouette)
  strokePath(c, P, 0, N - 1, halfW * 2 + cell * .1, 'rgba(3,12,14,.9)');
  // ── 3. body gradient fill
  const bg = c.createLinearGradient(L.bx, L.by, L.bx + L.boardW * .55, L.by + L.boardH);
  bg.addColorStop(0, '#2fd4e8');
  bg.addColorStop(.45, '#3ee6c4');
  bg.addColorStop(.78, '#7dffd6');
  bg.addColorStop(1, '#c8fff0');
  strokePath(c, P, 0, N - 1, halfW * 2, bg);
  // ── 4. top sheen
  c.save();
  c.translate(-cell * .05, -cell * .06);
  strokePath(c, P, 0, N - 1, halfW * 0.85, 'rgba(225,255,248,.20)');
  c.restore();
  // bottom inner shadow adds roundness
  c.save();
  c.translate(cell * .045, cell * .07);
  strokePath(c, P, 0, N - 1, halfW * .8, 'rgba(4,60,60,.16)');
  c.restore();

  // ── 5. scale ticks going round the tube
  drawScales(c, P, N, cell, tSec, r);

  // ── 6. fins on tight turns
  drawFins(c, P, N, halfW, cell, tSec);

  // ── 7. head
  drawHead(c, hpx, hpy, cell, tSec, dk, r);

  // speed / power streaks around the head
  if (speedBoost) {
    c.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      const idx = Math.max(0, N - 6 - k * 3);
      c.globalAlpha = .12 * (1 - k * .3);
      c.beginPath(); c.arc(P[idx * 2], P[idx * 2 + 1], halfW * (1.6 + k), 0, TAU);
      c.fillStyle = '#5ee4ff'; c.fill();
    }
    c.globalAlpha = alpha;
    c.globalCompositeOperation = 'source-over';
  }
  c.restore();

  // shield bubble
  if (S.shield > 0 && S.phase === 'playing') {
    c.save();
    c.globalCompositeOperation = 'lighter';
    const R = cell * 1.25;
    const g2 = c.createRadialGradient(hpx, hpy, R * .4, hpx, hpy, R);
    g2.addColorStop(0, 'rgba(157,255,207,0)');
    g2.addColorStop(.75, 'rgba(157,255,207,.10)');
    g2.addColorStop(1, 'rgba(157,255,207,.24)');
    c.beginPath(); c.arc(hpx, hpy, R, 0, TAU); c.fillStyle = g2; c.fill();
    c.beginPath(); c.arc(hpx, hpy, R, 0, TAU);
    c.strokeStyle = 'rgba(157,255,207,.55)'; c.lineWidth = 1.6; c.stroke();
    c.restore();
  }
  // phantom aura
  if (phantom && !dying) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = .16 + .06 * Math.sin(tSec * 8);
    strokePath(c, P, 0, N - 1, halfW * 2 + cell * .3, '#ffd166');
    c.restore();
  }
  c.globalAlpha = 1;
}

function drawScales(c, P, N, cell, tSec, r) {
  // one slim chevron band per cell — reads as scales, not stripes
  const SUB = 4;                       // buildRoute uses 4 samples per cell
  c.save();
  c.strokeStyle = 'rgba(8,52,52,.16)';
  c.lineWidth = Math.max(1, cell * .04);
  c.lineCap = 'round';
  c.beginPath();
  for (let i = 6; i < N - 3; i += SUB) {
    const x = P[i * 2], y = P[i * 2 + 1];
    const dx = P[i * 2 + 2] - P[i * 2], dy = P[i * 2 + 3] - P[i * 2 + 1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const w = cell * .2;
    c.moveTo(x + nx * w, y + ny * w);
    c.lineTo(x + (dx / len) * cell * .035, y + (dy / len) * cell * .035);
    c.lineTo(x - nx * w, y - ny * w);
  }
  c.stroke();
  c.restore();
}

function drawFins(c, P, N, halfW, cell, tSec) {
  // detect curvature: compare direction over a short window; draw side "gill" spikes
  const win = 6;
  c.save();
  c.globalCompositeOperation = 'lighter';
  const step = 3;
  for (let i = 4; i < N - win - 2; i += step) {
    const ax = P[(i - win) * 2], ay = P[(i - win) * 2 + 1];
    const bx = P[i * 2], by = P[i * 2 + 1];
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const curv = Math.abs(dx * P[i * 2 + 2] + dy * P[i * 2 + 3] - (dx * bx + dy * by)) / (len * len + .001);
    const k = clamp(curv * 2.4, 0, 1) * clamp((N - i) / 20, 0, 1);
    if (k < .12) continue;
    const side = (dx * (P[i * 2 + 2] - bx) + dy * (P[i * 2 + 3] - by)) > 0 ? 1 : -1;
    const fl = k * cell * .34;
    c.globalAlpha = .30 * k;
    c.beginPath();
    c.moveTo(bx + nx * halfW * .9 * side, by + ny * halfW * .9 * side);
    c.lineTo(bx + nx * (halfW + fl) * side - dx / len * cell * .12, by + ny * (halfW + fl) * side - dy / len * cell * .12);
    c.lineTo(bx + nx * halfW * .9 * side + dx / len * cell * .16, by + ny * halfW * .9 * side + dy / len * cell * .16);
    c.closePath();
    c.fillStyle = '#b6ffe4';
    c.fill();
  }
  c.globalAlpha = 1;
  c.restore();
}

function drawHead(c, x, y, cell, tSec, dk, r) {
  const D0 = DIRS[S.dir];
  const ang = D0.a;
  const hs = cell * .47;
  const gx = x + D0.x * cell * .04, gy = y + D0.y * cell * .04;
  c.save();
  c.translate(gx, gy);
  c.rotate(ang);
  // glow behind head
  c.globalCompositeOperation = 'lighter';
  const spr = G.glowHeads[0];
  const gs = hs * 3.4;
  c.globalAlpha = .55;
  c.drawImage(spr, -gs / 2, -gs / 2, gs, gs);
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
  // head shape: rounded wedge
  const g = c.createLinearGradient(-hs, -hs, hs, hs);
  g.addColorStop(0, '#d9fff2'); g.addColorStop(.5, '#8affe0'); g.addColorStop(1, '#3ee6c4');
  c.beginPath();
  c.moveTo(hs * 1.02, 0);
  c.quadraticCurveTo(hs * .95, -hs * .92, hs * .06, -hs * .9);
  c.quadraticCurveTo(-hs * .82, -hs * .8, -hs * .86, 0);
  c.quadraticCurveTo(-hs * .82, hs * .8, hs * .06, hs * .9);
  c.quadraticCurveTo(hs * .95, hs * .92, hs * 1.02, 0);
  c.closePath();
  c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = Math.max(1, cell * .04); c.stroke();
  // brow / helmet line
  c.beginPath();
  c.moveTo(-hs * .1, -hs * .86); c.quadraticCurveTo(hs * .55, -hs * .62, hs * .72, -hs * .22);
  c.moveTo(-hs * .1, hs * .86); c.quadraticCurveTo(hs * .55, hs * .62, hs * .72, hs * .22);
  c.strokeStyle = 'rgba(6,60,58,.25)'; c.lineWidth = Math.max(1, cell * .05); c.stroke();
  // eyes
  const ex = hs * .42, ey = hs * .42;
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(ex, ey * s, hs * .26, hs * .22, 0, 0, TAU);
    c.fillStyle = '#04141a'; c.fill();
    c.beginPath(); c.arc(ex + hs * .06, ey * s - hs * .04, hs * .1, 0, TAU);
    c.fillStyle = '#ffffff'; c.fill();
    c.beginPath(); c.arc(ex - hs * .04, ey * s + hs * .05, hs * .05, 0, TAU);
    c.fillStyle = 'rgba(94,242,184,.9)'; c.fill();
  }
  // tongue
  if (S.phase === 'playing' || S.phase === 'demo') {
    const flick = (tSec * 1.6) % 1;
    if (flick < .16) {
      const k = Math.sin(flick / .16 * Math.PI);
      c.beginPath();
      c.moveTo(hs * .95, 0); c.lineTo(hs * (1.1 + .5 * k), 0);
      c.moveTo(hs * (1.1 + .5 * k), 0); c.lineTo(hs * (1.24 + .5 * k), -hs * .17);
      c.moveTo(hs * (1.1 + .5 * k), 0); c.lineTo(hs * (1.24 + .5 * k), hs * .17);
      c.strokeStyle = '#ff6fa5'; c.lineWidth = Math.max(1.2, cell * .06); c.lineCap = 'round'; c.stroke();
    }
  }
  c.restore();
}
/* ══════════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ══════════════════════════════════════════════════════════════════════════════ */
let lastFrame = performance.now();
let fpsAcc = 0, fpsFrames = 0, fpsShown = 60, msShown = 16;

function frame(now) {
  // Re-arm FIRST: a throw anywhere below must never kill the render chain for good.
  requestAnimationFrame(frame);
  const rawDt = Math.min(.05, (now - lastFrame) / 1000) || .0166;
  lastFrame = now;
  try {
    frameBody(now, rawDt);
  } catch (err) {
    // Surface once, keep the game alive, and fall back to a safe static redraw.
    if (!frame.failed) {
      frame.failed = true;
      console.error('[neon-serpent] frame error (contained):', err);
    }
    try { render(now); drawFXLayer(now); } catch (e2) { /* keep looping */ }
  }
}

function frameBody(now, rawDt) {

  // FPS bookkeeping + adaptive quality
  fpsAcc += rawDt; fpsFrames++;
  if (fpsAcc >= .5) {
    fpsShown = Math.round(fpsFrames / fpsAcc);
    msShown = (fpsAcc / fpsFrames) * 1000;
    quality.fpsEMA = quality.fpsEMA * .6 + fpsShown * .4;
    D.fpsVal.textContent = fpsShown;
    D.fpsSub.textContent = msShown.toFixed(1) + ' ms' + (quality.resolved === 1 ? ' · LOW' : '');
    if (quality.level === 'auto') {
      if (quality.fpsEMA < 46) { quality.low++; quality.high = 0; } else if (quality.fpsEMA > 57) { quality.high++; quality.low = 0; }
      if (quality.low >= 4 && view.dprCap > 1) { view.dprCap = 1; resize(); quality.low = 0; }
      if (quality.high >= 8 && view.dprCap < 2) { view.dprCap = 2; resize(); quality.high = 0; }
    }
    fpsAcc = 0; fpsFrames = 0;
  }

  // time scale (slow-mo)
  cam.tsT = lerp(cam.tsT, 1, 1 - Math.exp(-4 * rawDt));
  cam.timeScale = lerp(cam.timeScale, cam.tsT, 1 - Math.exp(-14 * rawDt));
  const dt = rawDt * cam.timeScale;

  if (S.phase === 'playing' || S.phase === 'demo') {
    S.acc += dt;
    let guard = 0;
    while (S.acc >= S.tickDur && guard++ < 4 && (S.phase === 'playing' || S.phase === 'demo')) {
      S.acc -= S.tickDur;
      S.lastTickAt = now - S.acc * 1000;
      if (S.phase === 'playing' || S.phase === 'demo') {
        if (S.replayMode) {
          // feed the recorded direction for this tick; '' means "keep going"
          const d = S.replayDirs && S.replayDirs[S.replayIdx++];
          if (d && DIRS[d] && d !== OPP[S.dir]) S.dir = d;
          if (!S.replayDirs || S.replayIdx >= S.replayDirs.length) S.replayMode = false;
        } else if (S.demoAI) {
          aiSteer();
        }
        step();
      }
      S.elapsed += S.tickDur;
      if (S.boostTimer > 0) S.boostTimer -= S.tickDur * 1000;
      if (S.slowTimer > 0) S.slowTimer -= S.tickDur * 1000;
      if (S.phantomTimer > 0) S.phantomTimer -= S.tickDur * 1000;
      if (S.magnetTimer > 0) S.magnetTimer -= S.tickDur * 1000;
    }
    if (S.goldFood && S.goldFood.ttl && now - S.goldFood.born > S.goldFood.ttl) {
      const c = S.goldFood; S.goldFood = null;
      FX.ring(cellX(c.x), cellY(c.y), { r0: 2, r1: G.cell * 2, life: .5, color: PALETTE.gold, w: 1.6 });
    }
    magnetPull(dt);
  } else if (S.phase === 'dying') {
    S.dyingT += rawDt;
    if (S.dyingT > .42 && !S.endedShown) { S.endedShown = true; endGame(); }
  } else if (S.phase === 'menu') {
    demoUpdate(dt, now);
  }

  FX.update(rawDt);

  render(now);
  drawFXLayer(now);
}

function magnetPull(dt) {
  if (S.magnetTimer <= 0 || !S.food) return;
  const h = S.snake[0], f = S.food;
  const d = Math.abs(h.x - f.x) + Math.abs(h.y - f.y);
  if (d > 5.5) return;
  S.magnetAcc = (S.magnetAcc || 0) + dt;
  if (S.magnetAcc < .28) return;
  S.magnetAcc = 0;
  // step the food one cell toward the head
  const dx = Math.sign(h.x - f.x), dy = Math.sign(h.y - f.y);
  const tries = Math.abs(h.x - f.x) >= Math.abs(h.y - f.y) ? [[dx, 0], [0, dy]] : [[0, dy], [dx, 0]];
  for (const [ax, ay] of tries) {
    const nx = f.x + ax, ny = f.y + ay;
    if (!ax && !ay) continue;
    if (nx < 0 || ny < 0 || nx >= G.cols || ny >= G.rows) continue;
    if (G.walls && G.walls[ny * G.cols + nx]) continue;
    f.x = nx; f.y = ny;
    FX.trail(cellX(nx), cellY(ny), '#ff9ec4');
    break;
  }
}

/* ─────────────── demo (attract mode) ─────────────── */
function makeDemo() {
  layout();
  const { cols, rows } = G;
  S.snake = [{ x: (cols >> 1), y: (rows >> 1) }, { x: (cols >> 1) - 1, y: (rows >> 1) }, { x: (cols >> 1) - 2, y: (rows >> 1) }, { x: (cols >> 1) - 3, y: (rows >> 1) }];
  S.dir = 'right'; S.pendingDirs = []; S.tickDur = .15;
  S.eaten = 0; S.combo = 1; S.comboTimer = 0;
  S.boostTimer = S.slowTimer = S.phantomTimer = S.magnetTimer = 0;
  S.shield = 1; S.item = null; S.goldFood = null; S.hazards = [];
  S.maze = false; S.difficulty = 'normal'; S.demoAI = true; S.replayMode = true;
  G.playerWalls = false; G.walls = new Uint8Array(cols * rows);
  G.wormholes = G.portals.map(p => ({ a: p.a, b: p.b, hue: p.hue }));
  S.wormholes = G.wormholes;
  S.food = null; spawnFood(false);
  S.phase = 'demo';
  dirty = true;
}
function demoUpdate(dt, now) {
  if (!demo || !S.snake.length || S.phase !== 'demo') { makeDemo(); return; }
  S.elapsed += dt;
  S.acc += dt;
  let guard = 0;
  while (S.acc >= S.tickDur && guard++ < 3) {
    S.acc -= S.tickDur;
    S.lastTickAt = now - S.acc * 1000;
    aiSteer();
    step();
    if (S.phase !== 'demo') break;
    if (S.comboTimer > 0) { S.comboTimer -= S.tickDur; if (S.comboTimer <= 0) S.combo = 1; }
  }
  if (S.phase === 'demo' && S.snake.length > 46) {
    // reset gracefully
    const cut = 14;
    S.snake.length = cut;
    FX.burst(cellX(S.snake[0].x), cellY(S.snake[0].y), 26, { color: '#7dffd6', spd: 220, life: .8 });
  }
}
function aiSteer() {
  const target = S.food || (S.goldFood && Math.random() < .35 ? S.goldFood : S.food);
  const nd = aiDecide(S.snake, target, G);
  if (!nd || nd === S.dir || nd === OPP[S.dir]) return;
  // queue the turn the same way a human input would, so step() consumes it
  S.pendingDirs.length = 0;
  S.pendingDirs.push(nd);
}

/* ══════════════════════════════════════════════════════════════════════════════
   FX LAYER (cleared every frame)
   ══════════════════════════════════════════════════════════════════════════════ */
function drawFXLayer(now) {
  const c = fctx;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.clearRect(0, 0, view.w, view.h);
  const sh = cam.shake;
  c.save();
  if (sh > .1) c.translate(rand(-sh, sh) * .35, rand(-sh, sh) * .35);
  const zoom = 1 + cam.zoom;
  if (Math.abs(zoom - 1) > .0005) {
    c.translate(view.w / 2, view.h / 2); c.scale(zoom, zoom); c.translate(-view.w / 2, -view.h / 2);
  }
  // magnet indicator
  if (S.magnetTimer > 0 && S.snake.length) {
    const h = S.snake[0];
    const hx = cellX(h.x), hy = cellY(h.y);
    c.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      const p = ((now / 900) + k / 3) % 1;
      c.beginPath();
      c.arc(hx, hy, G.cell * (.6 + p * 4.6), 0, TAU);
      c.strokeStyle = 'rgba(255,158,196,' + (.16 * (1 - p)) + ')';
      c.lineWidth = 1.4; c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
  }
  FX.draw(c);
  c.restore();
}

/* ══════════════════════════════════════════════════════════════════════════════
   INPUT
   ══════════════════════════════════════════════════════════════════════════════ */
const onAttract = () => S.phase === 'menu' || S.phase === 'demo';
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
};
function pushDir(d) {
  if (S.phase !== 'playing' && S.phase !== 'demo') return;
  if (S.demoAI) S.demoAI = false;
  const last = S.pendingDirs.length ? S.pendingDirs[S.pendingDirs.length - 1] : S.dir;
  if (d === last || d === OPP[last]) return;
  if (S.pendingDirs.length < 2) S.pendingDirs.push(d);
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (KEYMAP[k]) {
    e.preventDefault();
    if (onAttract()) startGame();          // a direction key on the attract screen starts a run
    else pushDir(KEYMAP[k]);
    return;
  }
  switch (k) {
    case ' ':
      e.preventDefault();
      if (onAttract() || S.phase === 'over') startGame();
      else if (S.phase === 'playing') pauseGame();
      else if (S.phase === 'paused') resumeGame();
      break;
    case 'Enter':
      e.preventDefault();
      if (onAttract() || S.phase === 'over') startGame();
      else if (S.phase === 'paused') resumeGame();
      break;
    case 'r': case 'R':
      if (!onAttract()) startGame();
      break;
    case 'p': case 'P': case 'Escape':
      if (S.phase === 'playing') pauseGame(); else if (S.phase === 'paused') resumeGame();
      break;
    case 'm': case 'M': toggleSound(); break;
    case 'q': case 'Q': if (!onAttract()) quitToMenu(); break;
  }
}, { passive: false });

/* swipe */
let touchStart = null;
D.app.addEventListener('touchstart', e => {
  if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() };
}, { passive: true });
D.app.addEventListener('touchmove', e => {
  if (!touchStart || S.phase !== 'playing') return;
  const t = e.touches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.hypot(dx, dy) > 22) {
    pushDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touchStart = { x: t.clientX, y: t.clientY, t: performance.now() };
  }
}, { passive: true });
D.app.addEventListener('touchend', () => { touchStart = null; }, { passive: true });

/* dpad */
$$('#dpad button').forEach(b => {
  const fire = e => {
    e.preventDefault();
    pushDir(b.dataset.dir);
    b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 110);
  };
  b.addEventListener('pointerdown', fire);
});

/* ══════════════════════════════════════════════════════════════════════════════
   UI WIRING
   ══════════════════════════════════════════════════════════════════════════════ */
const SVG = {
  soundOn: '<path d="M4 9.5h3l4.5-3.6v12.2L7 14.5H4z" fill="none"/><path d="M15.4 8.6a5 5 0 0 1 0 6.8M18 6a8.4 8.4 0 0 1 0 12"/>',
  soundOff: '<path d="M4 9.5h3l4.5-3.6v12.2L7 14.5H4z" fill="none"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>',
  music: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  quality: '<path d="M4 15l4-4 3 3 5-6 4 4"/><path d="M4 20h16"/>',
  pause: '<path d="M9 5v14M15 5v14"/>',
  play: '<path d="M7 4.5l12 7.5-12 7.5z"/>',
  restart: '<path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3M3.5 4v5h5"/>'
};
function setBtn(el, icon, tip) {
  if (!el) return;
  el.innerHTML = '<svg viewBox="0 0 24 24">' + icon + '</svg>' + (tip ? '<span class="tip">' + tip + '</span>' : '');
}
function refreshIcons() {
  setBtn($('#btn-sound'), Audio2.enabled ? SVG.soundOn : SVG.soundOff);
  $('#btn-sound').classList.toggle('on', Audio2.enabled);
  $('#btn-sound').setAttribute('aria-pressed', Audio2.enabled ? 'true' : 'false');
  setBtn($('#btn-music'), SVG.music);
  $('#btn-music').classList.toggle('on', Audio2.musicOn);
  const q = quality.level;
  const qBtn = $('#btn-quality');
  if (qBtn) {
    const qLabel = '画质 ' + (q === 'auto' ? 'AUTO' : q === 'high' ? '高' : '低');
    qBtn.innerHTML = '<svg viewBox="0 0 24 24">' + SVG.quality + '</svg><span class="tip">' + qLabel + '</span>';
  }
  setBtn($('#btn-pause'), S.phase === 'paused' ? SVG.play : SVG.pause);
  setBtn($('#btn-restart'), SVG.restart);
  setBtn($('#m-btn-pause'), S.phase === 'paused' ? SVG.play : SVG.pause);
  setBtn($('#m-btn-restart'), SVG.restart);
  setBtn($('#m-btn-sound'), Audio2.enabled ? SVG.soundOn : SVG.soundOff);
}
function toggleSound() { Audio2.setEnabled(!Audio2.enabled); Audio2.ui(); refreshIcons(); }
function togglePause() {
  if (S.phase === 'playing') pauseGame();
  else if (S.phase === 'paused') resumeGame();
  refreshIcons();
}
$('#btn-sound').onclick = toggleSound;
$('#m-btn-sound').onclick = toggleSound;
$('#btn-music').onclick = () => { Audio2.toggleMusic(); Audio2.ui(); refreshIcons(); };
$('#btn-quality').onclick = () => {
  quality.level = quality.level === 'auto' ? 'high' : quality.level === 'high' ? 'low' : 'auto';
  store.set('quality', quality.level); resize(); refreshIcons(); toast('画质', quality.level === 'auto' ? '自动适应' : quality.level === 'high' ? '高' : '低', '');
};
$('#btn-pause').onclick = togglePause;
$('#m-btn-pause').onclick = togglePause;
$('#btn-restart').onclick = () => { if (S.phase !== 'menu') { S.endedShown = false; startGame({ maze: S.maze }); } };
$('#m-btn-restart').onclick = $('#btn-restart').onclick;
$('#btn-start').onclick = () => { Audio2.ui(); startGame(); };
$('#btn-again').onclick = () => { Audio2.ui(); S.endedShown = false; startGame({ maze: S.maze }); };
$('#btn-resume').onclick = () => { Audio2.ui(); resumeGame(); refreshIcons(); };
$('#btn-restart-2').onclick = () => { Audio2.ui(); S.endedShown = false; startGame({ maze: S.maze }); };
$('#btn-quit').onclick = () => { Audio2.ui(); quitToMenu(); refreshIcons(); };
$('#btn-menu').onclick = () => { Audio2.ui(); quitToMenu(); refreshIcons(); };
$('#btn-watch-replay').onclick = () => { Audio2.ui(); startReplay(); };
$('#btn-replay').onclick = () => { Audio2.ui(); startReplay(); };
$('#btn-demo').onclick = () => {
  Audio2.ensure(); Audio2.ui();
  document.body.classList.remove('menu');
  D.menu.classList.add('hide');
  S.phase = 'menu'; S.demoAI = true;
  makeDemo();
  setPhaseUI();
  toast('自动演示', '按任意方向键接管', 'violet');
};
$('#btn-maze').onclick = () => {
  Audio2.ensure(); Audio2.ui();
  S.endedShown = false;
  startGame({ maze: true });
  toast('迷宫模式', '墙壁不可穿越', 'magenta');
};
$$('.diff').forEach(b => b.addEventListener('click', () => {
  $$('.diff').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  S.difficulty = b.dataset.diff;
  store.set('diff', S.difficulty);
  Audio2.ui();
  toast('难度', DIFFS[S.difficulty].label + (DIFFS[S.difficulty].wrap ? ' · 可穿墙' : ' · 撞墙即死'), '');
}));

function startReplay() {
  const dirs = replay.frames;
  if (!dirs || dirs.length < 16) { toast('暂无回放', '先完成一局', 'magenta'); return; }
  Audio2.ensure();
  S.endedShown = false;
  startGame({ maze: false });
  // Drive the same fixed-step sim from the recorded direction stream.
  S.replayMode = true; S.demoAI = false;
  S.replayDirs = dirs.slice();
  S.replayIdx = 0;
  S.lastDirSeen = S.dir;
  toast('回放', '正在重现上一局 · ' + dirs.length + ' 帧', 'violet');
  D.hudMode.textContent = 'REPLAY';
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.phase === 'playing') { pauseGame(); refreshIcons(); }
});
window.addEventListener('blur', () => { if (S.phase === 'playing') { pauseGame(); refreshIcons(); } });

/* ══════════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════════ */
function boot() {
  const savedDiff = store.get('diff', 'normal');
  S.difficulty = DIFFS[savedDiff] ? savedDiff : 'normal';
  $$('.diff').forEach(x => x.setAttribute('aria-pressed', x.dataset.diff === S.difficulty ? 'true' : 'false'));
  resize();
  updateMenuStats();
  refreshIcons();
  syncHUD(true);
  D.hudMode.textContent = DIFFS[S.difficulty].label.toUpperCase();
  document.body.classList.add('menu');
  D.vignette.style.opacity = '0';
  makeDemo();
  requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });
  setTimeout(() => D.loading.classList.add('done'), 220);
  // warm the audio graph on first gesture
  const warm = () => { Audio2.ensure(); window.removeEventListener('pointerdown', warm); window.removeEventListener('keydown', warm); };
  window.addEventListener('pointerdown', warm, { once: true });
  window.addEventListener('keydown', warm, { once: true });
  window.__NEON_READY__ = true;
}

/* ── debug / automation API ── */
window.SNAKE = {
  get state() {
    return {
      phase: S.phase, score: S.score, best: S.best, length: S.snake.length, dir: S.dir,
      food: S.food && { x: S.food.x, y: S.food.y }, gold: S.goldFood && { x: S.goldFood.x, y: S.goldFood.y },
      item: S.item && { x: S.item.x, y: S.item.y, key: S.item.key },
      combo: S.combo, speed: nextSpeed(), tickDur: S.tickDur, elapsed: S.elapsed,
      head: S.snake[0] && { x: S.snake[0].x, y: S.snake[0].y },
      grid: G && { cols: G.cols, rows: G.rows }, headPx: G && S.snake[0] && { x: cellX(S.snake[0].x), y: cellY(S.snake[0].y) },
      shield: S.shield, fps: fpsShown, dpr: view.dpr, canvas: { w: D.cv.width, h: D.cv.height, cssW: view.w, cssH: view.h }
    };
  },
  start: opts => { S.endedShown = false; startGame(opts || {}); },
  pause: pauseGame, resume: resumeGame, quit: quitToMenu,
  setDifficulty: d => { if (DIFFS[d]) S.difficulty = d; },
  setSpeed: n => { S.tickDur = 1 / n; },
  turn: d => { if (DIRS[d]) { S.pendingDirs.length = 0; S.dir = d; } },
  push: d => pushDir(d),
  setDemoAI: v => { S.demoAI = !!v; },
  fx: FX,
  audio: Audio2,
  step: () => step(),
  get fxCount() { return FX.parts.length; }
};
window.__SNAKE_TEST__ = window.SNAKE;

try { boot(); } catch (e) { console.error('[neon-serpent] boot failed', e); }
})();
</script>
