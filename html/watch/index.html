<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKELETON CALIBRE SW-01 · 交互式 3D 镂空机械腕表</title>
<meta name="description" content="高细节交互式 3D 镂空机械腕表：主发条、齿轮系、摆轮游丝、擒纵机构、夹板、红宝石轴承、蓝宝石水晶与夜光指针，支持爆炸视图与零件标签。">
<meta name="theme-color" content="#06070a">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --gold:#c9a86a; --gold-2:#e6cf9c; --gold-dim:rgba(201,168,106,.32);
    --ink:#0a0b0e; --glass:rgba(14,16,20,.62); --glass-2:rgba(10,11,14,.78);
    --line:rgba(255,255,255,.09); --txt:#e8e6e1; --txt-dim:rgba(232,230,225,.56);
    --sans:"Helvetica Neue",Helvetica,Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:#06070a;color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{background:
      radial-gradient(120% 90% at 50% 8%, #1b1f26 0%, #0d0f13 42%, #06070a 100%);}
  #app,#app canvas{position:absolute;inset:0;display:block}
  #app canvas{touch-action:none;outline:none}
  .no-select{user-select:none;-webkit-user-select:none}

  /* ---------- overlays ---------- */
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
    background:
      radial-gradient(130% 105% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.72) 100%),
      linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 62%, rgba(0,0,0,.5) 100%)}
  #grain{position:absolute;inset:-50%;pointer-events:none;z-index:5;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    animation:grainShift 1.1s steps(3) infinite}
  @keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-2%,1.5%)}66%{transform:translate(1.5%,-1%)}100%{transform:translate(0,0)}}
  #labels{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}

  /* ---------- HUD top ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;
    align-items:flex-start;gap:18px;padding:20px 24px;pointer-events:none}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:34px;height:34px;flex:0 0 34px;border:1px solid var(--gold-dim);border-radius:50%;
    display:grid;place-items:center;color:var(--gold);font-size:12px;box-shadow:inset 0 0 18px rgba(201,168,106,.14)}
  .brand b{display:block;font-size:13.5px;letter-spacing:.34em;font-weight:600;color:#f2efe9}
  .brand i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.26em;color:var(--gold);margin-top:5px;opacity:.92}
  #hud-stats{display:flex;gap:22px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--txt-dim);
    letter-spacing:.06em;padding-top:3px}
  #hud-stats b{display:block;color:#f0ece4;font-size:12.5px;font-weight:500;letter-spacing:.02em;margin-top:3px}
  #hud-stats .sep{width:1px;background:linear-gradient(180deg,transparent,var(--line),transparent)}

  /* ---------- info panel ---------- */
  #info-panel{position:absolute;left:24px;top:104px;width:326px;max-height:calc(100vh - 240px);z-index:6;
    background:linear-gradient(180deg,var(--glass),var(--glass-2));border:1px solid var(--line);
    border-left:1px solid var(--gold-dim);border-radius:3px;backdrop-filter:blur(14px) saturate(120%);
    -webkit-backdrop-filter:blur(14px) saturate(120%);padding:18px 18px 16px;overflow:hidden auto;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1)}
  #info-panel::-webkit-scrollbar{width:4px}
  #info-panel::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
  #info-kicker{font-size:9px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
  #info-title{font-size:19px;font-weight:500;letter-spacing:.06em;margin:9px 0 3px;color:#f5f2ec}
  #info-title small{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--txt-dim);margin-top:6px;font-weight:400}
  #info-desc{font-size:11.5px;line-height:1.85;color:rgba(232,230,225,.74);margin-top:11px;letter-spacing:.02em}
  .rule{height:1px;margin:14px 0 12px;background:linear-gradient(90deg,var(--gold-dim),rgba(255,255,255,.06) 55%,transparent)}
  #info-specs{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:11px}
  #info-specs dt{color:var(--txt-dim);letter-spacing:.04em;white-space:nowrap}
  #info-specs dd{color:#eae6de;font-family:var(--mono);font-size:10.5px;text-align:right;letter-spacing:.02em}
  #info-specs dd em{font-style:normal;color:var(--gold-2)}
  .live{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7fd18a;margin-right:7px;
    box-shadow:0 0 8px #7fd18a;animation:pulse 1.6s ease-in-out infinite;vertical-align:middle}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- toolbar ---------- */
  #toolbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;display:flex;flex-wrap:wrap;
    justify-content:center;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;
    background:linear-gradient(180deg,var(--glass),var(--glass-2));border:1px solid var(--line);
    backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);max-width:min(1080px,calc(100vw - 40px))}
  .group{display:flex;align-items:center;gap:6px}
  .group+.group{padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
  button{font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:rgba(232,230,225,.8);cursor:pointer;
    background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.075);border-radius:2px;padding:8px 12px;
    transition:all .22s ease;white-space:nowrap;position:relative;overflow:hidden}
  button:hover{color:#fff;border-color:var(--gold-dim);background:rgba(201,168,106,.09)}
  button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
  button.on{color:#0c0d10;background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold-2);
    font-weight:600;box-shadow:0 0 22px rgba(201,168,106,.28)}
  button .k{font-family:var(--mono);font-size:9px;opacity:.5;margin-left:6px}
  .slider{gap:10px}
  .slider label{font-size:10px;letter-spacing:.16em;color:var(--txt-dim);display:flex;gap:8px;align-items:center}
  .slider label span{color:var(--gold-2);font-family:var(--mono);font-size:10px;min-width:30px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold) 0%,var(--gold) var(--fill,0%),rgba(255,255,255,.14) var(--fill,0%));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#f0e6d2;box-shadow:0 0 10px rgba(201,168,106,.7);cursor:grab}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:#f0e6d2;
    box-shadow:0 0 10px rgba(201,168,106,.7)}

  /* ---------- hint ---------- */
  #hint{position:absolute;right:24px;bottom:30px;z-index:6;text-align:right;font-size:10px;line-height:2;
    letter-spacing:.1em;color:rgba(232,230,225,.34);pointer-events:none}
  #hint b{color:var(--gold);font-weight:500}

  /* ---------- tooltip ---------- */
  #tooltip{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-140%);opacity:0;
    transition:opacity .16s ease;padding:7px 11px;border-radius:2px;background:rgba(8,9,12,.9);
    border:1px solid var(--gold-dim);backdrop-filter:blur(8px);white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #tooltip b{font-size:11.5px;letter-spacing:.08em;color:#f4f1ea;font-weight:500}
  #tooltip i{font-style:normal;display:block;font-size:9px;letter-spacing:.16em;color:var(--gold);margin-top:3px}

  /* ---------- 3D labels ---------- */
  .lbl{position:absolute;display:flex;align-items:center;gap:7px;transform:translate(-50%,-50%);
    font-size:10px;letter-spacing:.1em;color:rgba(238,235,229,.86);white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.9);transition:opacity .3s ease}
  .lbl .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:0 0 5px;
    box-shadow:0 0 9px rgba(201,168,106,.9)}
  .lbl .txt{padding:2px 8px 2px 0;border-bottom:1px solid rgba(201,168,106,.28)}
  .lbl .en{font-family:var(--mono);font-size:8.5px;opacity:.45;letter-spacing:.06em}
  .lbl.hot{color:#fff}
  .lbl.hot .dot{background:#fff;box-shadow:0 0 14px #fff}
  .lbl.hot .txt{border-bottom-color:rgba(255,255,255,.5)}

  /* ---------- loading ---------- */
  #loading{position:absolute;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;gap:0;
    background:radial-gradient(70% 60% at 50% 45%, #14171d 0%, #08090c 60%, #050608 100%);
    transition:opacity .8s ease}
  #loading.done{opacity:0;pointer-events:none}
  #loading .ring{width:78px;height:78px;border-radius:50%;border:1px solid rgba(201,168,106,.18);
    border-top-color:var(--gold);animation:spin 1.25s linear infinite;margin-bottom:26px;position:relative}
  #loading .ring:after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(255,255,255,.06);
    border-bottom-color:rgba(201,168,106,.5);animation:spin 2.1s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading h1{font-size:14px;font-weight:500;letter-spacing:.36em;color:#efe9dd}
  #loading p{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--txt-dim);margin-top:14px;max-width:440px;text-align:center;line-height:1.9}
  #loading .bar{width:230px;height:1px;background:rgba(255,255,255,.1);margin-top:20px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .4s ease;box-shadow:0 0 10px var(--gold)}
  #loading.fatal h1{color:#e8b4a0;letter-spacing:.2em;font-size:13px}
  @media (max-width:900px){
    #info-panel{width:276px;left:12px;top:92px;max-height:44vh}
    #hint{display:none}
    #hud-stats .opt{display:none}
  }
  @media (max-width:620px){
    #info-panel{display:none}
    .brand b{font-size:11.5px;letter-spacing:.22em}
  }
  @media (prefers-reduced-motion: reduce){
    #grain{animation:none}
    #loading .ring,#loading .ring:after{animation-duration:3s}
  }
</style>
</head>
<body class="no-select">
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="labels"></div>

<header id="hud">
  <div class="brand">
    <span class="mark">◆</span>
    <div><b>ATELIER CHRONOS</b><i>CALIBRE SW-01 · SQUELETTE</i></div>
  </div>
  <div id="hud-stats">
    <div class="opt">振频<b>28 800 A/h</b></div>
    <div class="sep opt"></div>

<div id="hint">
  <div><b>拖拽</b> 旋转腕表 · <b>滚轮</b> 推近机芯</div>

</div>

</div>

<script>
(function(){
  window.__WATCH_FATAL=function(msg){
    var l=document.getElementById('loading'); if(!l) return;
    l.classList.add('fatal'); l.classList.remove('done');
    var t=document.getElementById('loading-text'); if(t) t.textContent=msg;
    var h=l.querySelector('h1'); if(h) h.textContent='无法完成渲染';
  };
  setTimeout(function(){
    var l=document.getElementById('loading');
    if(l&&l.classList.contains('fatal')) return;   // a precise error is already on screen
    if(!window.__WATCH__||!window.__WATCH__.ready){
      window.__WATCH_FATAL('引擎加载超时。可能无法访问 CDN（unpkg / jsdelivr）或当前环境未启用 WebGL2。请检查网络后刷新页面。');
    }
  },24000);
  window.addEventListener('error',function(e){
    if(!window.__WATCH__||!window.__WATCH__.ready){
      window.__WATCH_FATAL('运行错误：'+(e&&e.message?e.message:'资源加载失败')+'。请刷新页面重试。');
    }
  });
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* ═══════════════════════════════════════════════════════════════════
   1 ·  ENGINE  ·  renderer / scene / camera / controls / post
   ═══════════════════════════════════════════════════════════════════ */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const LOADING = { bar: $('loading-bar'), txt: $('loading-text'), el: $('loading') };
const progress = (p, msg) => { LOADING.bar.style.width = (p * 100).toFixed(0) + '%'; if (msg) LOADING.txt.textContent = msg; };

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', stencil: false, alpha: false });
} catch (err) {
  window.__WATCH_FATAL('当前浏览器/环境无法创建 WebGL 上下文。'); throw err;
}
/* software rasterisers (SwiftShader / llvmpipe) get a cheaper pipeline */
let SOFT_GPU = false;
try {
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const who = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
  SOFT_GPU = /swiftshader|llvmpipe|software|basic render/i.test(who);
} catch (e) { }
const DPR = Math.min(window.devicePixelRatio || 1, SOFT_GPU ? 1 : 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.87;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.6, 2600);
camera.position.set(37, 65, 55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.75;
controls.panSpeed = 0.6;
controls.minDistance = 17;
controls.maxDistance = 210;
controls.minPolarAngle = 0.03;
controls.maxPolarAngle = 1.47;
controls.screenSpacePanning = false;
controls.update();

/* --- label overlay (CSS2D) --- */
const labelRenderer = new CSS2DRenderer({ element: $('labels') });
labelRenderer.setSize(window.innerWidth, window.innerHeight);

/* --- post processing: bloom for the lume + polished highlights --- */
const composer = new EffectComposer(renderer);
if (!SOFT_GPU) {
  // renderer antialias does not reach composer targets — request MSAA here
  try {
    composer.renderTarget1.samples = 4; composer.renderTarget2.samples = 4;
    composer.renderTarget1.dispose(); composer.renderTarget2.dispose();
  } catch (e) { /* MSAA optional */ }
}
composer.setPixelRatio(DPR);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.12, 0.32, 0.90);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ═══════════════════════════════════════════════════════════════════
   2 ·  STUDIO ENVIRONMENT  ·  softbox rig → PMREM  (luxury reflections)
   ═══════════════════════════════════════════════════════════════════ */
function buildStudio() {
  const s = new THREE.Scene();
  const plane = new THREE.PlaneGeometry(1, 1);
  const strip = (w, h, hex, intensity, pos, rot) => {
    const m = new THREE.Mesh(plane, new THREE.MeshBasicMaterial({
      color: new THREE.Color(hex).multiplyScalar(intensity), side: THREE.DoubleSide
    }));
    m.scale.set(w, h, 1); m.position.copy(pos); m.rotation.set(rot[0], rot[1], rot[2]); s.add(m);
  };
  // key softbox — broad overhead panel (defines the long specular streak on polished gold)
  strip(230, 230, 0xfff3e2, 0.80, new THREE.Vector3(-14, 150, 24), [-Math.PI / 2, 0, 0]);
  // warm frontal strip — shapes bezel & crystal highlights
  strip(150, 26, 0xffe6c2, 1.10, new THREE.Vector3(-52, 46, 118), [0.18, -0.72, 0]);
  // cool rim strip behind — separates the case from the dark background
  strip(210, 20, 0xa8c8ff, 0.90, new THREE.Vector3(58, 62, -140), [0.1, 0.58, 0]);
  // narrow side kicker — crisp edge glints on the flanks
  strip(8, 90, 0xffffff, 0.90, new THREE.Vector3(150, 34, -6), [0, -Math.PI / 2, 0]);
  strip(8, 90, 0xdfe8ff, 0.60, new THREE.Vector3(-150, 30, 6), [0, Math.PI / 2, 0]);
  // soft bottom bounce so shadowed metal never goes dead black
  strip(200, 200, 0x2e3440, 0.45, new THREE.Vector3(0, -130, 0), [Math.PI / 2, 0, 0]);
  // light tent — a broad cylindrical diffusion wall. Metals can only mirror, so
  // without a large-area source a skeleton movement renders as black holes. Kept
  // dim: it sets the floor level, the shaped strips above do the sculpting.
  const tent = new THREE.Mesh(
    new THREE.CylinderGeometry(190, 190, 300, 48, 1, true),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0xaeb9c8).multiplyScalar(.20), side: THREE.BackSide })
  );
  s.add(tent);

  const boost = lumeNow * .85 + lumeCharge * .5;
  for (const p of PARTS) {
    if (!p.glow) continue;
    for (const m of p.mats) {
      if (!m.emissive) continue;
      const lum = m.emissive.r + m.emissive.g + m.emissive.b;
      if (lum > .05) m.emissiveIntensity = (m.userData.baseEmissiveIntensity || 0) + boost;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════
   18 ·  UI WIRING
   ═══════════════════════════════════════════════════════════════════ */
const btn = { explode: $('btn-explode'), labels: $('btn-labels'), lume: $('btn-lume'), rotate: $('btn-rotate'), reset: $('btn-reset') };
const range = $('explode-range'), rangeVal = $('explode-val');
function setExplode(v, fromSlider) {
  explodeTarget = clamp(v, 0, 1);
  if (!fromSlider) { range.value = String(Math.round(explodeTarget * 100)); }
  range.style.setProperty('--fill', (explodeTarget * 100).toFixed(0) + '%');
  rangeVal.textContent = Math.round(explodeTarget * 100) + '%';
  btn.explode.classList.toggle('on', explodeTarget > .02);
  if (explodeTarget > .02 && camera.position.distanceTo(controls.target) < 100) {
    // frame the whole flying-apart stack instead of letting parts leave the frame
    const dir = camera.position.clone().sub(controls.target).normalize();
    const tgt = controls.target.clone();
    tgt.y = Math.max(tgt.y, 3.0);
    const dist = Math.max(camera.position.distanceTo(controls.target) * 1.12, 96);
    tw.from.pos = camera.position.clone(); tw.to.pos = tgt.clone().addScaledVector(dir, dist);
    tw.from.tgt = controls.target.clone(); tw.to.tgt = tgt;
    tw.fromFlip = watchRoot.rotation.x; tw.toFlip = watchRoot.rotation.x;
    tw.fromFov = camera.fov; tw.toFov = camera.fov;
    tw.t = 0; tw.active = true;
  }
}
btn.explode.onclick = () => setExplode(explodeTarget > .5 ? 0 : 1);
range.oninput = () => setExplode(parseFloat(range.value) / 100, true);
btn.labels.onclick = () => { labelsOn = !labelsOn; btn.labels.classList.toggle('on', labelsOn); };
btn.lume.onclick = () => {
  lumeOn = !lumeOn; btn.lume.classList.toggle('on', lumeOn);
  if (lumeOn) lumeCharge = 1.35;
};
btn.rotate.onclick = () => { autoRotate = !autoRotate; btn.rotate.classList.toggle('on', autoRotate); controls.autoRotate = autoRotate; controls.autoRotateSpeed = .85; };
btn.reset.onclick = () => {
  setExplode(0); select(null); hover(null); view('hero');
  labelsOn = true; btn.labels.classList.add('on');
  lumeOn = false; btn.lume.classList.remove('on');
  autoRotate = false; btn.rotate.classList.remove('on'); controls.autoRotate = false;
};
document.querySelectorAll('.view-btn').forEach(b => b.onclick = () => view(b.dataset.view));
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  const k = e.key.toLowerCase();
  if (k === 'e') setExplode(explodeTarget > .5 ? 0 : 1);
  else if (k === 'l') btn.labels.onclick();
  else if (k === 'n') btn.lume.onclick();
  else if (k === 'r') btn.rotate.onclick();
  else if (k === '0') btn.reset.onclick();
  else if (k === 'escape') select(null);
  else if ('123456'.includes(k)) view(['hero', 'front', 'movement', 'escapement', 'caseback', 'side'][+k - 1]);
});
/* part list in the panel (clickable legend) */
let downXY = null;
dom.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; TOOLTIP.style.opacity = 0; });

/* ═══════════════════════════════════════════════════════════════════
   19 ·  LOOP
   ═══════════════════════════════════════════════════════════════════ */
let elapsed = 0, paused = false, lastT = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60, statT = 0;
const FPS_EL = $('st-fps'), PARTS_EL = $('st-parts');
PARTS_EL.textContent = pickables.length + ' 件';
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  composer.setPixelRatio(renderer.getPixelRatio());
  labelRenderer.setSize(w, h);
  measureHud();
}
addEventListener('resize', onResize);
onResize();
addEventListener('visibilitychange', () => { lastT = performance.now(); });
/* robustness: context loss recovery + reduced-motion preference */
dom.addEventListener('webglcontextlost', e => {
  e.preventDefault();                        // lets the browser restore the context
  if (window.__WATCH__) window.__WATCH__.ready = false;
  LOADING.el.classList.remove('done');
  window.__WATCH_FATAL('3D 上下文已丢失（显存不足或系统休眠可能导致）。正在尝试恢复；若无响应请刷新页面。');
}, false);
dom.addEventListener('webglcontextrestored', () => { location.reload(); }, false);
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if (REDUCED_MOTION) tw.dur = .2;             // instant camera moves, the calibre keeps beating

const _lv = new THREE.Vector3(), Z_AXIS = new THREE.Vector3(0, 0, 1);
/* Labels are children of their part, and eight parts spin — without this the
   balance label would orbit through the whole ±240° swing eight times a second. */
const SPINNERS = [wheelRefs.center, wheelRefs.third, wheelRefs.fourth, wheelRefs.escape,
  wheelRefs.pallet, wheelRefs.balance, wheelRefs.rotor, BYKEY.barrel.obj];
for (const p of PARTS) p.counterSpin = SPINNERS.indexOf(p.obj) >= 0;

/* Screen-space label layout: priority-ordered, never overlapping each other and
   never covering the HUD. A label that cannot be placed is simply hidden. */
function measureHud() {
  hudRects = [];
  for (const id of ['info-panel', 'hud-stats', 'toolbar', 'hud']) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (id === 'hud') continue;                       // full-width header bar, not a blocker
    if (getComputedStyle(el).display === 'none') continue;
    const r = el.getBoundingClientRect();
    if (r.width > 1) hudRects.push({ x: r.left, y: r.top, w: r.width, h: r.height });
  }
}
measureHud();
const labelBoxes = [];
function tickLabels() {
  if (hudDirty) { measureHud(); hudDirty = false; }   // panel size settles after boot
  const W = window.innerWidth, H = window.innerHeight;
  labelBoxes.length = 0;
  for (const c of hudRects) labelBoxes.push({ x: c.x, y: c.y, w: c.w, h: c.h, hud: true });
  const cand = [];
  for (const p of PARTS) {
    const l = p.label; if (!l) continue;
    if (p.stripCands) {                 // strip parts: keep the first run that fits
      const bw = 46 + (p.zh.length + (p.en ? p.en.length * .6 : 0)) * 11.5;
      let pick = -1;
      for (let i = 0; i < p.stripCands.length; i++) {
        _lv.copy(p.stripCands[i]).applyMatrix4(p.obj.matrixWorld).project(camera);
        if (_lv.z < -1 || _lv.z > 1 || Math.abs(_lv.x) > .97 || Math.abs(_lv.y) > .97) continue;
        const bx = (_lv.x * .5 + .5) * W, by = (-_lv.y * .5 + .5) * H - 10.5;
        let clash = false;
        for (const b of labelBoxes) {
          if (bx < b.x + b.w && bx + bw > b.x && by < b.y + b.h && by + 21 > b.y) { clash = true; break; }
        }
        if (!clash) { pick = i; break; }
      }
      if (pick < 0) { l.visible = false; l.element.classList.remove('hot'); continue; }
      l.position.copy(p.stripCands[pick]);
    }
    if (p.counterSpin) l.position.copy(l.userData.base).applyAxisAngle(Z_AXIS, -p.obj.rotation.z);
    const hot = p.key === hoverKey || p.key === selKey;
    let vis = labelsOn && p.obj.visible;
    if (vis && p.tier === 2 && explodeNow < .55 && !hot) vis = false;  // hover, or once exploded
    if (vis) {                                  // drop labels whose anchor left the frame
      _lv.copy(l.position).applyMatrix4(p.obj.matrixWorld).project(camera);
      if (_lv.z < -1 || _lv.z > 1 || Math.abs(_lv.x) > .97 || Math.abs(_lv.y) > .97) vis = false;
    }
    if (!vis) { l.visible = false; l.element.classList.remove('hot'); continue; }
    const chars = p.zh.length + (p.en ? p.en.length * .6 : 0);
    cand.push({
      l, el: l.element, hot,
      // center(0,.5) anchors the label at its LEFT edge, vertical middle, so the
      // box top is anchorY - h/2 (the HUD rects beside it are r.top based).
      x: (_lv.x * .5 + .5) * W, y: (-_lv.y * .5 + .5) * H - 10.5,
      w: 46 + chars * 11.5, h: 21,
      pr: hot ? 0 : (p.tier === 1 ? 1 : 2)
    });
  }
  cand.sort((a, b) => a.pr - b.pr);
  for (const c of cand) {
    let clash = false;
    for (const b of labelBoxes) {
      if (c.x < b.x + b.w && c.x + c.w > b.x && c.y < b.y + b.h && c.y + c.h > b.y) { clash = true; break; }
    }
    if (clash) { c.l.visible = false; c.el.classList.remove('hot'); continue; }
    labelBoxes.push({ x: c.x, y: c.y, w: c.w, h: c.h });
    c.l.visible = true;
    c.el.classList.toggle('hot', c.hot);
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  if (!paused) elapsed += dt;
  if (dt > 0) { fpsAcc += 1 / dt; fpsN++; }
  // eased state
  const ePrev = explodeNow;
  explodeNow += (explodeTarget - explodeNow) * Math.min(1, dt * 6.5);
  if (Math.abs(explodeNow - ePrev) > 1e-4) applyExplode(explodeNow);
  lumeNow += ((lumeOn ? 1 : 0) - lumeNow) * Math.min(1, dt * 3.4);
  lumeCharge *= Math.pow(.12, dt);
  if (lumeCharge > 1e-3 || Math.abs(lumeNow - (lumeOn ? 1 : 0)) > 1e-3) applyLume(lumeNow);
  applyLumeMaterials();   // the luminous compound owns its emissiveIntensity every frame
  updateKinematics(elapsed);
  stepCamera(dt);
  controls.update();
  // hover picking only when the pointer actually moved
  if (ptr.dirty && !tw.active) { hover(pickKey()); ptr.dirty = false; }
  tickLabels();
  composer.render();
  labelRenderer.render(scene, camera);
  // HUD stats
  statT += dt;
  if (statT > .3) {
    statT = 0;
    hudDirty = true;                 // the stats box resizes as digits change
    if (fpsN) { fps = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0; }
    FPS_EL.textContent = Math.round(fps);
    if (!selKey) setOverview();
    TOOLTIP.style.opacity = hoverKey ? 1 : 0;
  }
  if (!window.__WATCH__ || !window.__WATCH__.ready) {
    progress(1, '装配完成');
    requestAnimationFrame(() => LOADING.el.classList.add('done'));
    window.__WATCH__ = api;
    // separate handle (kept out of __WATCH__ so that stays JSON-serialisable)
    window.__WATCH_DEBUG__ = { THREE, scene, camera, renderer, watchRoot, BYKEY, PARTS, pickables, bloom, composer, controls };
    document.body.dataset.ready = '1';
  }
}
/* ═══════════════════════════════════════════════════════════════════
   20 ·  DEBUG / AUTOMATION API
   ═══════════════════════════════════════════════════════════════════ */
const api = {
  ready: true, version: '1.0', three: THREE.REVISION,
  partCount: pickables.length, parts: PARTS.map(p => p.key),
  get t() { return elapsed; },                 // live simulation clock (contract)
  partInfo: k => { const p = BYKEY[k]; return p ? { zh: p.zh, en: p.en, specs: p.specs } : null; },
  state: () => ({
    explode: explodeTarget, explodeNow, labels: labelsOn, lume: lumeOn, autoRotate,
    view: currentView, hovered: hoverKey, selected: selKey, fps: Math.round(fps),
    t: elapsed, meshes: pickables.length, parts: PARTS.length, paused,
    softGPU: SOFT_GPU, dpr: DPR, three: THREE.REVISION,
    camera: camera.position.toArray().map(v => +v.toFixed(2)), target: controls.target.toArray().map(v => +v.toFixed(2))
  }),
  setExplode: v => setExplode(v), toggleExplode: () => setExplode(explodeTarget > .5 ? 0 : 1),
  setLabels: v => { labelsOn = !!v; btn.labels.classList.toggle('on', labelsOn); },
  setLume: v => { if (!!v !== lumeOn) btn.lume.onclick(); },
  setAutoRotate: v => { if (!!v !== autoRotate) btn.rotate.onclick(); },
  setView: n => view(n), highlight: k => hover(k || null), select: k => select(k || null),
  focus: k => focusPart(k), pause: v => { paused = !!v; lastT = performance.now(); },
  setTime: t => { elapsed = t; updateKinematics(elapsed); }
};
applyExplode(0); applyLume(0); applyLumeMaterials(); updateKinematics(0); setOverview();
requestAnimationFrame(frame);
</script>
</body>
</html>
